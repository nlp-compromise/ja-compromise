<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title>ja-compromise デモ</title>
  <style>
    body {
      font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    }

    textarea {
      width: 50%;
      margin-top: 4%;
      margin-left: 25%;
      padding: 10px;
      font-size: 15px;
      color: grey;
      min-height: 200px;
      border-radius: 5px;
      line-height: 1.6rem;
    }

    #result {
      color: steelblue;
      font-size: 17px;
      margin: 20px;
      margin-left: 15%;
      line-height: 1.9rem;
      margin-top: 3rem;
      white-space: pre-wrap;
    }

    h3 {
      color: grey;
    }

    .nouns {
      color: #6393b9;
    }

    .verbs {
      color: palevioletred;
    }

    .adj {
      color: #3f9c7d;
    }

    .adv {
      color: #7b7791;
    }

    .det {
      color: #d3c0b3;
    }

    .conj {
      color: #a8a9b4;
    }

    .particle {
      color: #bbb;
    }

    .num {
      color: #f39c73;
    }

    .verbs,
    .nouns {
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div id="pos-demo">
    <h3>日本語の品詞タグ付け</h3>
    <div style="color:cornflowerblue;">
      (part-of-speech tagging in japanese)
      <a href="https://github.com/nlp-compromise/ja-compromise" style="margin-left:100px; color:steelblue;">with
        ja-compromise</a>
    </div>
    <textarea type="text" id="text" onKeyPress="tagger()" onKeyUp="tagger()">
彼女は毎朝コーヒーを飲みながら新聞を読みます。
昨日は雨が降っていたので、家で本を読んでいました。
田中さんは日本語がとても上手です。
子供たちは公園で楽しそうに遊んでいる。
この問題はそんなに難しくなかった。
明日は早く起きなければなりません。
先生に褒められて、とても嬉しかった。
京都へ行ったことがありますか。
      </textarea>
    <table style="width:50%; margin-left:25%; text-align:center;">
      <tr>
        <td class="nouns">名詞</td>
        <td class="verbs">動詞</td>
        <td class="adj">形容詞</td>
        <td class="adv">副詞</td>
        <td class="det">連体詞</td>
        <td class="conj">接続詞</td>
        <td class="particle">助詞</td>
        <td class="num">数</td>
      </tr>
    </table>
    <pre id="result">-</pre>
  </div>

  <!-- <script type="text/javascript" src="https://unpkg.com/ja-compromise"></script> -->
  <script type="text/javascript" src="../builds/ja-compromise.min.js"></script>
  <script type="text/javascript">
    var nlp = window.jaCompromise;
    function tagger() {
      var txt = document.getElementById('text').value || '';
      var doc = nlp(txt)
      // a leading '.' makes html() emit <span class="..">  - without it,
      // the key becomes the element name and the css never applies
      var highlight = {
        '.nouns': '#Noun',
        '.verbs': '#Verb',
        '.adj': '#Adjective',
        '.adv': '#Adverb',
        '.det': '#Determiner',
        '.conj': '#Conjunction',
        '.particle': '#Particle',
        '.num': '#Value',
      }
      document.getElementById('result').innerHTML = doc.html(highlight)
    }
    tagger();//fire!
  </script>

</body>

</html>
